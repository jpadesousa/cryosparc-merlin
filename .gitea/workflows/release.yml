name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binaries
        env:
          VERSION: ${{ gitea.ref_name }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 \
            go build \
            -ldflags="-X main.version=${VERSION}" \
            -o dist/cryosparc-merlin-linux-amd64 \
            .

          GOOS=linux GOARCH=arm64 \
            go build \
            -ldflags="-X main.version=${VERSION}" \
            -o dist/cryosparc-merlin-linux-arm64 \
            .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum cryosparc-merlin-* > checksums.txt

      - name: Create Gitea release
        uses: akkuman/gitea-release-action@v1
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          tag_name: ${{ gitea.ref_name }}
          name: ${{ gitea.ref_name }}
          files: |
            dist/cryosparc-merlin-linux-amd64
            dist/cryosparc-merlin-linux-arm64
            dist/checksums.txt
